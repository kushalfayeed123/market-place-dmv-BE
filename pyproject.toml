# pyproject.toml
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-backend"
version = "0.1.0"
description = "Backend API for the Marketplace Platform"
authors = [
    {name = "Marketplace Team", email = "team@marketplace.example"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[postgresql]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "asyncmy>=0.2.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
]

# Explicitly specify packages to avoid setuptools discovery issues
[tool.setuptools]
packages = ["app", "alembic"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fakeredis>=2.24.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "alembic>=1.13.0"
]

[project.scripts]
marketplace-backend = "app.main:app"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.flake8]
max-line-length = 88
extend-ignore = ['E203', 'W503']

[tool.mypy]
python-version = "3.12"
warn_return_any = true
warn_unused_configs = true
